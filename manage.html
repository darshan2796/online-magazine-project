<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>POP RAZZ - Manage Articles</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

   <link rel="stylesheet" href="styles.css">
   <link rel="stylesheet" href="manage.css">
</head>

<body>

   <header class="text-center">
      <h1 class="display-1 fw-bold">POP RAZZ</h1>
      <p>Entertainment Article Management</p>
   </header>

   <nav class="bg-dark text-center p-3">
      <a class="text-white m-3" href="index.html">HOME</a>
      <a class="text-white m-3" href="index.html#celebrity">CELEBRITY</a>
      <a class="text-white m-3" href="index.html#music">MUSIC</a>
      <a class="text-white m-3" href="index.html#movies-tv">MOVIES & TV</a>
      <a class="text-white m-3" href="signup.html">SUBSCRIBE</a>
      <a class="text-white m-3" href="manage.html">MANAGE ARTICLES</a>
   </nav>

   <main class="container mt-5 mb-5">

      <h2 class="text-center fw-bold">Manage Articles</h2>
      <p class="text-center">
         Add, update, and search POP RAZZ entertainment articles.
      </p>

      <div id="message" class="mb-3" role="status"></div>

      <form id="articleForm" class="card p-4 mb-5">

         <div class="mb-3">
            <label for="articleId" class="form-label">Article ID</label>
            <input type="text" id="articleId" class="form-control" required>
         </div>

         <div class="mb-3">
            <label for="title" class="form-label">Article Title</label>
            <input type="text" id="title" class="form-control" required>
         </div>

         <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select id="category" class="form-select" required>
                <option value="">Choose a category</option>
                <option value="Celebrity">Celebrity</option>
                <option value="Music">Music</option>
                <option value="Movies & TV">Movies & TV</option>
            </select>
         </div>

         <div class="mb-3">
            <label for="format" class="form-label">Article Format</label>
            <select id="format" class="form-select" required>
                <option value="">Choose a format</option>
                <option value="News">News</option>
                <option value="Review">Review</option>
                <option value="Interview">Interview</option>
            </select>
         </div>

         <div class="mb-3">
            <label for="value" class="form-label">Article Value (points)</label>
            <input type="number" id="value" class="form-control"
                   min="0" step="1" required>
         </div>

         <div class="mb-3">
            <label for="details" class="form-label">
                Author or Short Description (Optional)
            </label>
            <input type="text" id="details" class="form-control">
         </div>

         <button type="submit" id="saveButton" class="btn btn-dark">
            Add Article
        </button>

         <button type="button" id="cancelButton"
                class="btn btn-secondary mt-2" hidden>
            Cancel Update
        </button>
      </form>

      <h3>Search Articles</h3>

      <input type="text" id="searchInput" class="form-control mb-3"
           placeholder="Search by article title or category">

      <button type="button" id="exportButton"
            class="btn btn-outline-dark mb-3">
        Download Articles as JSON
    </button>

      <div class="table-responsive">
         <table class="table table-bordered table-striped">
            <thead class="table-dark">
               <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Format</th>
                  <th>Points</th>
                  <th>Details</th>
                  <th>Actions</th>
               </tr>
            </thead>
            <tbody id="articleList"></tbody>
         </table>
      </div>

   </main>

   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
   <script src="manage.js"></script>

</body>

</html>
